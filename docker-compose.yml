version: "3.9"
services:
  frontend:
    build: ./frontend
    container_name: jagriti_frontend
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - jagriti_net

  backend:
    build: ./backend
    container_name: jagriti_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=jagriti
      - DB_USER=jagriti
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - NLP_SERVICE_URL=http://nlp-service:8000
      - DB_SSL=false
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    networks:
      - jagriti_net

  nlp-service:
    build: ./nlp-service
    container_name: jagriti_nlp
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=jagriti
      - DB_USER=jagriti
      - DB_PASSWORD=${DB_PASSWORD}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - jagriti_net

  postgres:
    image: postgis/postgis:15-3.3
    container_name: jagriti_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=jagriti
      - POSTGRES_USER=jagriti
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - jagriti_net

  nginx:
    image: nginx:alpine
    container_name: jagriti_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - jagriti_net

volumes:
  postgres_data:

networks:
  jagriti_net:
    driver: bridge
